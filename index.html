<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0614" />
  <title>Calc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main class="calc" id="calc">
    <header class="topbar">
      <div class="brand"><span class="dot"></span>calc</div>
      <div class="toggles">
        <button class="pill" id="sciToggle" aria-pressed="false" title="Scientific mode (S)">sci</button>
        <button class="pill" id="angleToggle" title="Angle unit">rad</button>
        <button class="pill" id="historyToggle" aria-pressed="false" title="History (H)">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
        </button>
      </div>
    </header>

    <section class="display" aria-live="polite">
      <div class="expr" id="expr" title="Expression"></div>
      <button class="result" id="result" title="Click to copy">0</button>
      <div class="toast" id="toast">copied</div>
    </section>

    <section class="sci-pad" id="sciPad" aria-label="Scientific functions">
      <button data-fn="sin(">sin</button>
      <button data-fn="cos(">cos</button>
      <button data-fn="tan(">tan</button>
      <button data-fn="ln(">ln</button>
      <button data-fn="log(">log</button>
      <button data-fn="√(">√</button>
      <button data-ins="^2">x²</button>
      <button data-ins="^">xʸ</button>
      <button data-ins="π">π</button>
      <button data-ins="e">e</button>
      <button data-ins="!">n!</button>
      <button data-ins="ans">ans</button>
    </section>

    <section class="pad" aria-label="Keypad">
      <button class="fn" data-act="clear" id="clearBtn">AC</button>
      <button class="fn" data-ins="(">(</button>
      <button class="fn" data-ins=")">)</button>
      <button class="op" data-ins="÷">÷</button>

      <button data-ins="7">7</button>
      <button data-ins="8">8</button>
      <button data-ins="9">9</button>
      <button class="op" data-ins="×">×</button>

      <button data-ins="4">4</button>
      <button data-ins="5">5</button>
      <button data-ins="6">6</button>
      <button class="op" data-ins="−">−</button>

      <button data-ins="1">1</button>
      <button data-ins="2">2</button>
      <button data-ins="3">3</button>
      <button class="op" data-ins="+">+</button>

      <button data-ins="%">%</button>
      <button data-ins="0">0</button>
      <button data-ins=".">.</button>
      <button class="eq" data-act="equals" aria-label="Equals">=</button>
    </section>

    <aside class="history" id="history" aria-label="History">
      <div class="history-head">
        <span>history</span>
        <button class="pill" id="clearHistory">clear</button>
      </div>
      <ol id="historyList"></ol>
      <p class="empty" id="historyEmpty">Nothing yet. Do some math.</p>
    </aside>
  </main>

  <p class="hint">type to calculate · <kbd>enter</kbd> = · <kbd>esc</kbd> clear · <kbd>⌫</kbd> delete</p>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
